name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Increased timeout because full build+test+deploy on the remote VPS
    # can exceed 10 minutes for larger releases (builds, migrations, npm ci, etc.)
    # Set to 60 minutes — adjust as needed for your infra.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Stop script on first error
            set -e

            # Navigate to project directory
            # Ensure this secret is set in GitHub: /var/www/finara or /home/user/finara
            cd ${{ secrets.PROJECT_PATH }}

            # Pull latest changes
            echo "🚀 Pulling latest changes..."
            git pull origin main -f 

            # Install dependencies
            # using npm ci for faster, reliable installs (requires package-lock.json)
            echo "📦 Installing dependencies..."
            npm ci

            # Generate Prisma Client
            echo "🗄️ Generating Prisma Client..."
            npm run db:generate

            # Run Tests
            echo "🧪 Running tests..."
            npm test

            # Build application
            # Note: This runs on the VPS. Ensure the VPS has enough resources.
            # Increase Node.js memory limit to prevent OOM during build
            echo "🏗️ Building application..."
            export NODE_OPTIONS="--max-old-space-size=4096"
            npm run build

            # Restart PM2 process
            # Ensure the app is already started with PM2 named 'finara' (or change variable)
            echo "🔄 Restarting PM2 process..."
            pm2 reload ${{ secrets.PM2_APP_NAME || 'finara' }} --update-env

            echo "✅ Deployment successful!"

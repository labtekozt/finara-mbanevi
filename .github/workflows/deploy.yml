name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # Run tests locally in GitHub Actions (faster and fails early)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate Prisma Client
        run: npm run db:generate
      
      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 25m
          script: |
            # Stop script on first error
            set -e

            # Navigate to project directory
            cd ${{ secrets.PROJECT_PATH }}

            # Pull latest changes
            echo "🚀 Pulling latest changes..."
            git pull origin main -f 

            # Install dependencies (use npm install to preserve existing node_modules)
            echo "📦 Installing dependencies..."
            npm install --prefer-offline --no-audit

            # Generate Prisma Client
            echo "🗄️ Generating Prisma Client..."
            npm run db:generate

            # Build application with optimizations (skip type checking and linting)
            echo "🏗️ Building application..."
            export NODE_OPTIONS="--max-old-space-size=4096"
            export NEXT_TELEMETRY_DISABLED=1
            npm run build:prod

            # Restart PM2 process
            echo "🔄 Restarting PM2 process..."
            pm2 reload ${{ secrets.PM2_APP_NAME || 'finara' }} --update-env

            echo "✅ Deployment successful!"
